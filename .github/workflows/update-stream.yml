name: Auto-Update Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Kills the job automatically if it gets stuck for more than 10 mins

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          # Install ONLY the Chromium browser binary to save time and prevent hanging
          playwright install chromium --with-deps

      - name: Run script
        run: |
          python your_script.py  # Replace with your actual python script filename

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update playlist via cron [skip ci]" || exit 0
          git push
